<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Crear sistema IA</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(180deg,#050A18,#0b1220);
  color:white;
  text-align:center;
  padding:40px;
}

h1{
  font-size:36px;
}

.highlight{
  color:#22c55e;
}

textarea{
  width:100%;
  max-width:600px;
  height:120px;
  padding:15px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

button{
  margin-top:15px;
  padding:16px 26px;
  background:#22c55e;
  color:black;
  border:none;
  border-radius:10px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

#output{
  margin-top:30px;
  max-width:700px;
  margin-left:auto;
  margin-right:auto;
  background:#111827;
  padding:25px;
  border-radius:12px;
  white-space:pre-wrap;
}

.paywall{
  margin-top:30px;
  padding:25px;
  background:#111827;
  border-radius:12px;
}

.paywall a{
  display:inline-block;
  margin-top:15px;
  padding:14px 20px;
  background:#22c55e;
  color:black;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>
  🚀 Genera un <span class="highlight">sistema de ingresos</span> con IA
</h1>

<textarea id="prompt" placeholder="Ej: quiero automatizar mi negocio"></textarea><br>

<button id="btn">Generar sistema</button>

<div id="output"></div>
<div id="paywall"></div>

<script>
let usos = localStorage.getItem("usos") || 0;
usos = parseInt(usos);

const MAX = 3;

document.getElementById("btn").addEventListener("click", async () => {

  if (usos >= MAX) {
    showPaywall();
    return;
  }

  const prompt = document.getElementById("prompt").value;

  document.getElementById("output").innerText = "Generando...";

  try {

    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ prompt })
    });

    const data = await res.json();

    usos++;
    localStorage.setItem("usos", usos);

    document.getElementById("output").innerText = data.result;

    if (usos >= MAX) {
      showPaywall();
    }

  } catch (e) {
    document.getElementById("output").innerText = "Error IA";
  }

});

function showPaywall(){
  document.getElementById("paywall").innerHTML = `
    <div class="paywall">
      <h2>🚫 Has llegado al límite</h2>
      <p>Desbloquea generación ilimitada</p>

      <a href="https://buy.stripe.com/00wdR90kLe7j0fp9KfabK01">
        🔓 Activar PRO
      </a>
    </div>
  `;
}
</script>

</body>
</html>
