<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sistema Maestro IA</title>

<style>
body {
  font-family: Arial;
  background: #0b1220;
  color: white;
  padding: 40px;
}

.container {
  max-width: 700px;
  margin: auto;
}

textarea {
  width: 100%;
  height: 120px;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

button {
  margin-top: 10px;
  padding: 12px 20px;
  background: #22c55e;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#output {
  margin-top: 30px;
  background: #111827;
  padding: 20px;
  border-radius: 10px;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="container">
  <h1>🚀 Sistema Maestro IA</h1>

  <textarea id="prompt" placeholder="Ej: quiero ganar dinero con IA"></textarea>

  <button id="btn">Generar</button>

  <div id="output"></div>
</div>

<script>
const btn = document.getElementById("btn");

btn.addEventListener("click", async () => {

  const prompt = document.getElementById("prompt").value;

  if (!prompt) {
    alert("Escribe algo");
    return;
  }

  document.getElementById("output").innerText = "Generando...";

  try {

    const res = await fetch("http://localhost:3000/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ prompt })
    });

    const data = await res.json();

    document.getElementById("output").innerText = data.result;

  } catch (err) {
    console.error(err);
    document.getElementById("output").innerText = "Error conectando con backend";
  }

});
</script>

</body>
</html>
