<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Demo — SISTEMA MAESTRO IA</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <meta name="theme-color" content="#060B1A">
  <meta name="description" content="Demo pública de SISTEMA MAESTRO IA con backend real." />

  <style>
    :root{
      --bg:#0A0A0F;
      --border:#1F2430;
      --text:#FFFFFF;
      --muted:#B0B7C3;
      --shadow:0 12px 40px rgba(0,0,0,.45);
      --radius:16px;
      --mono:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(900px 500px at 80% -10%, rgba(30,107,255,.24), transparent 60%),
        radial-gradient(700px 420px at 20% 0%, rgba(0,210,255,.16), transparent 60%),
        radial-gradient(circle at 1px 1px, rgba(255,255,255,.08) 1px, transparent 0) 0 0/4px 4px,
        var(--bg);
      overflow-x:hidden;
    }
    .wrap{max-width:1200px;margin:0 auto;padding:24px}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      box-shadow:var(--shadow);
      position:sticky;top:12px;z-index:10;backdrop-filter:blur(10px);
    }
    .brand{display:flex;flex-direction:column;gap:2px}
    .brand .t{font-weight:800;letter-spacing:.3px}
    .brand .s{font-size:12px;color:var(--muted)}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;border:1px solid var(--border);
      background:rgba(17,19,26,.65);
      color:var(--muted);font-size:12px;
      white-space:nowrap;
    }
    .dot{width:8px;height:8px;border-radius:50%;background:rgba(0,210,255,.9);box-shadow:0 0 18px rgba(0,210,255,.6)}
    .grid{
      margin-top:18px;
      display:grid;
      grid-template-columns:420px 1fr;
      gap:18px;
      align-items:start;
    }
    .card{
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .card h2{
      margin:0;
      padding:14px 16px;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.14em;
      color:rgba(255,255,255,.86);
      border-bottom:1px solid var(--border);
      background:rgba(10,10,15,.35);
    }
    .card .body{padding:16px}
    .field{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
    label{font-size:12px;color:var(--muted)}
    textarea{
      width:100%;
      min-height:140px;
      resize:vertical;
      border:1px solid var(--border);
      border-radius:12px;
      background:rgba(14,16,22,.7);
      color:var(--text);
      padding:12px;
      outline:none;
      font-size:14px;
      line-height:1.5;
    }
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .btn{
      border:1px solid var(--border);
      background:rgba(17,19,26,.75);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      font-weight:700;
      cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      user-select:none;
    }
    .btn.primary{
      background:linear-gradient(90deg, rgba(0,210,255,.9), rgba(30,107,255,.9));
      border-color:rgba(30,107,255,.55);
    }
    .btn.ghost{background:transparent}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .status{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:rgba(14,16,22,.55);
      color:var(--muted);
      font-size:12px;
      display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
    }
    .status strong{color:rgba(255,255,255,.9)}
    .panes{display:grid;grid-template-rows:auto 1fr;gap:18px}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .subhead{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:12px 14px;border-bottom:1px solid var(--border);
      background:rgba(10,10,15,.35);
    }
    .subhead .title{font-size:12px;color:rgba(255,255,255,.86);letter-spacing:.06em;text-transform:uppercase}
    .subhead .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .frame{
      width:100%;
      height:520px;
      border:0;
      background:white;
      border-radius:0 0 var(--radius) var(--radius);
    }
    pre{
      margin:0;
      height:520px;
      overflow:auto;
      padding:14px;
      font-family:var(--mono);
      font-size:12.5px;
      line-height:1.5;
      background:rgba(10,10,15,.55);
      color:rgba(255,255,255,.9);
    }
    .toast{
      position:fixed;right:18px;bottom:18px;
      padding:10px 12px;border-radius:12px;border:1px solid var(--border);
      background:rgba(17,19,26,.92);color:rgba(255,255,255,.9);
      box-shadow:var(--shadow);
      opacity:0;transform:translateY(6px);
      transition:opacity .18s ease, transform .18s ease;
      pointer-events:none;
      font-size:12px;
    }
    .toast.show{opacity:1;transform:translateY(0)}
    @media (max-width:1080px){
      .grid{grid-template-columns:1fr}
      .split{grid-template-columns:1fr}
      .frame, pre{height:460px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="t">SISTEMA MAESTRO IA — Demo</div>
        <div class="s">Backend real conectado · Vista previa · Código</div>
      </div>
      <div class="pill"><span class="dot"></span> <span id="usesText">Usos restantes: 3</span></div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Generador</h2>
        <div class="body">
          <div class="field">
            <label for="prompt">Prompt</label>
            <textarea id="prompt" placeholder="Describe el contenido que quieres generar..."></textarea>
          </div>

          <div class="row">
            <button class="btn primary" id="btnGenerate" type="button">Generar contenido</button>
            <button class="btn ghost" id="btnReset" type="button">Reset</button>
            <button class="btn ghost" id="btnTestApi" type="button">Probar API</button>
          </div>

          <div class="status">
            <span>Estado: <strong id="statusText">Listo</strong></span>
            <span>Límite: <strong id="limitText">3 usos</strong></span>
          </div>
        </div>
      </div>

      <div class="panes">
        <div class="split">
          <div class="card">
            <div class="subhead">
              <div class="title">Vista previa</div>
              <div class="actions">
                <button class="btn" id="btnOpenNew" type="button">Abrir en pestaña</button>
              </div>
            </div>
            <iframe class="frame" id="previewFrame" title="Vista previa"></iframe>
          </div>

          <div class="card">
            <div class="subhead">
              <div class="title">Código HTML</div>
              <div class="actions">
                <button class="btn" id="btnCopy" type="button">Copiar</button>
              </div>
            </div>
            <pre><code id="codeBlock"></code></pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copiado</div>

  <script>
    const API_ENDPOINT = "/api/generate";
    const MAX_USAGE = 3;
    let usageCount = 0;

    const elPrompt = document.getElementById("prompt");
    const btnGenerate = document.getElementById("btnGenerate");
    const btnReset = document.getElementById("btnReset");
    const btnTestApi = document.getElementById("btnTestApi");
    const statusText = document.getElementById("statusText");
    const limitText = document.getElementById("limitText");
    const usesText = document.getElementById("usesText");
    const previewFrame = document.getElementById("previewFrame");
    const codeBlock = document.getElementById("codeBlock");
    const btnCopy = document.getElementById("btnCopy");
    const btnOpenNew = document.getElementById("btnOpenNew");
    const toast = document.getElementById("toast");

    let lastFull = "";

    async function killServiceWorkers() {
      if (!("serviceWorker" in navigator)) return;
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const reg of regs) {
          await reg.unregister();
        }
      } catch (e) {
        console.error(e);
      }
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    function updateUsageUI() {
      const remaining = Math.max(0, MAX_USAGE - usageCount);
      usesText.textContent = "Usos restantes: " + remaining;
      limitText.textContent = MAX_USAGE + " usos";
      btnGenerate.disabled = remaining <= 0;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1200);
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function renderPreview(fullHtml) {
      const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
      doc.open();
      doc.write(fullHtml || "<!doctype html><html><body></body></html>");
      doc.close();
    }

    function renderCode(fullHtml) {
      codeBlock.innerHTML = escapeHtml(fullHtml || "(vacío)");
    }

    async function callGenerate(promptText) {
      const response = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Cache-Control": "no-store"
        },
        body: JSON.stringify({ prompt: promptText })
      });

      const text = await response.text();

      let data = {};
      try {
        data = JSON.parse(text);
      } catch (_) {
        throw new Error("La API no devolvió JSON válido: " + text.slice(0, 200));
      }

      if (!response.ok) {
        throw new Error(data.error || ("HTTP " + response.status));
      }

      return data;
    }

    async function testApi() {
      setStatus("Probando API...");
      try {
        const response = await fetch(API_ENDPOINT, {
          method: "GET",
          headers: { "Cache-Control": "no-store" }
        });
        const text = await response.text();
        showToast("API responde");
        setStatus("API OK");
        renderCode(text);
      } catch (error) {
        console.error(error);
        setStatus("API caída");
        showToast("API no responde");
      }
    }

    async function onGenerate() {
      if (usageCount >= MAX_USAGE) {
        setStatus("Límite alcanzado");
        showToast("Límite demo alcanzado");
        return;
      }

      const promptText = (elPrompt.value || "").trim();
      if (!promptText) {
        showToast("Escribe algo antes de generar");
        elPrompt.focus();
        return;
      }

      btnGenerate.disabled = true;
      setStatus("Generando...");

      try {
        const data = await callGenerate(promptText);
        const raw = data?.html ?? data?.result ?? "";

        if (!raw) {
          throw new Error("La API respondió sin html ni result");
        }

        usageCount++;
        updateUsageUI();

        lastFull = String(raw);
        renderPreview(lastFull);
        renderCode(lastFull);
        setStatus("OK");
        showToast("Generado");
      } catch (error) {
        console.error(error);
        const msg = error?.message || "Error de conexión";
        setStatus("Error");
        showToast("Error");
        lastFull = `<!doctype html><html><body style="font-family:Arial,sans-serif;padding:24px">${escapeHtml(msg)}</body></html>`;
        renderPreview(lastFull);
        renderCode(lastFull);
      } finally {
        btnGenerate.disabled = usageCount >= MAX_USAGE;
      }
    }

    function onReset() {
      elPrompt.value = "";
      lastFull = "<!doctype html><html><body style='font-family:Arial,sans-serif;padding:24px'>Listo.</body></html>";
      usageCount = 0;
      updateUsageUI();
      renderPreview(lastFull);
      renderCode(lastFull);
      setStatus("Listo");
    }

    async function copyCode() {
      await navigator.clipboard.writeText(lastFull || "");
      showToast("Copiado");
    }

    function openInNewTab() {
      const w = window.open("", "_blank");
      if (!w) return;
      w.document.open();
      w.document.write(lastFull || "<!doctype html><html><body></body></html>");
      w.document.close();
    }

    btnGenerate.addEventListener("click", onGenerate);
    btnReset.addEventListener("click", onReset);
    btnTestApi.addEventListener("click", testApi);
    btnCopy.addEventListener("click", copyCode);
    btnOpenNew.addEventListener("click", openInNewTab);

    window.addEventListener("load", async () => {
      await killServiceWorkers();
      onReset();
    });
  </script>
</body>
</html>
