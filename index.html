<!-- PWA INSTALL SCRIPT CORRECTAMENTE COLOCADO -->
<script>
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;

  const installBtn = document.createElement('button');
  installBtn.innerText = "Instalar aplicación";
  installBtn.style.padding = "12px 24px";
  installBtn.style.marginTop = "30px";
  installBtn.style.background = "#38bdf8";
  installBtn.style.color = "#060B1A";
  installBtn.style.border = "none";
  installBtn.style.borderRadius = "8px";
  installBtn.style.fontWeight = "bold";
  installBtn.style.cursor = "pointer";

  document.body.appendChild(installBtn);

  installBtn.addEventListener('click', () => {
    installBtn.style.display = "none";
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
    });
  });
});
</script>
