<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sistema Maestro IA</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#050A18;
  color:white;
}

/* HERO */
.hero{
  text-align:center;
  padding:120px 20px;
}

.hero-content{
  max-width:900px;
  margin:auto;
}

.badge{
  display:inline-block;
  background:#22c55e;
  color:black;
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  margin-bottom:20px;
}

h1{
  font-size:54px;
  margin-bottom:20px;
  font-weight:800;
}

.highlight{
  color:#22c55e;
}

.sub{
  font-size:20px;
  opacity:0.9;
  margin-bottom:25px;
}

/* URGENCIA */
.urgency{
  font-size:14px;
  color:#facc15;
  margin-bottom:25px;
}

/* BOTONES */
.buttons{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:30px;
}

.btn-main{
  padding:18px 34px;
  background:#22c55e;
  color:black;
  border-radius:12px;
  text-decoration:none;
  font-weight:800;
  font-size:18px;
  box-shadow:0 0 20px rgba(34,197,94,0.4);
}

.btn-secondary{
  padding:14px 26px;
  background:#1e293b;
  color:white;
  border-radius:10px;
  text-decoration:none;
  font-weight:600;
}

/* INPUT */
.generator-box{
  max-width:700px;
  margin:20px auto;
}

textarea{
  width:100%;
  min-height:130px;
  border-radius:12px;
  padding:16px;
  font-size:16px;
  border:1px solid #334155;
  background:#0b1220;
  color:white;
}

/* PRUEBA SOCIAL */
.proof{
  margin-top:20px;
  font-size:14px;
  opacity:0.8;
}

/* FOOTER */
footer{
  padding:40px;
  text-align:center;
  opacity:0.5;
}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-content">

    <!-- MICRO HOOK -->
    <div class="badge">⚡ Nuevo sistema IA</div>

    <!-- HEADLINE -->
    <h1>
      Genera ingresos con IA <span class="highlight">sin saber programar</span>
    </h1>

    <!-- SUBHEAD -->
    <div class="sub">
      Crea sistemas automáticos que trabajan por ti en minutos
    </div>

    <!-- URGENCIA -->
    <div class="urgency">
      ⚠️ Acceso gratuito limitado hoy
    </div>

    <!-- CTA -->
    <div class="buttons">

      <a href="/demo.html" class="btn-main">
        🚀 Crear mi sistema ahora
      </a>

      <a href="https://buy.stripe.com/00wdR90kLe7j0fp9KfabK01" class="btn-secondary">
        Ver versión PRO
      </a>

    </div>

    <!-- INPUT -->
    <div class="generator-box">
      <textarea placeholder="Ej: quiero crear un sistema que genere ingresos con IA automáticamente..."></textarea>
    </div>

    <!-- PRUEBA -->
    <div class="proof">
      Más de ideas y sistemas generados automáticamente con IA
    </div>

  </div>
</section>

<footer>
  © 2026 SistemaMaestroIA
</footer>

</body>
</html>
