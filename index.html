<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sistema Maestro IA</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#060B1A;
  color:white;
}

/* HERO */
.hero{
  position:relative;
  text-align:center;
  padding:120px 20px;
  background:linear-gradient(180deg,#060B1A,#0b1220);
}

.hero-content{
  max-width:900px;
  margin:auto;
}

h1{
  font-size:52px;
  margin-bottom:20px;
  font-weight:800;
}

.highlight{
  color:#22c55e;
}

.hero p{
  font-size:20px;
  opacity:0.9;
  margin-bottom:30px;
}

/* BOTONES */
.buttons{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:40px;
}

.btn-pro{
  padding:16px 30px;
  background:#22c55e;
  color:white;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
}

.btn-demo{
  padding:14px 26px;
  background:#38bdf8;
  color:#060B1A;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
}

/* GENERADOR */
.generator-box{
  max-width:800px;
  margin:0 auto;
}

textarea{
  width:100%;
  min-height:140px;
  border-radius:12px;
  padding:16px;
  font-size:16px;
  border:1px solid #334155;
  background:#0b1220;
  color:white;
}

/* PRUEBA SOCIAL */
.trust{
  margin-top:20px;
  font-size:14px;
  opacity:0.7;
}

footer{
  padding:40px;
  text-align:center;
  opacity:0.6;
}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-content">

    <!-- HEADLINE QUE VENDE -->
    <h1>
      Crea un sistema que <span class="highlight">genera dinero con IA</span>
    </h1>

    <!-- SUBHEAD -->
    <p>
      Sin programar. Sin equipo. En menos de 60 segundos.
    </p>

    <!-- CTAs -->
    <div class="buttons">

      <a href="/demo.html" class="btn-demo">
        🚀 Empieza gratis
      </a>

      <a href="https://buy.stripe.com/00wdR90kLe7j0fp9KfabK01" class="btn-pro">
        Activar PRO
      </a>

    </div>

    <!-- INPUT (ENGANCHE) -->
    <div class="generator-box">
      <textarea placeholder="Ej: quiero ganar dinero con IA creando contenido automático..."></textarea>
    </div>

    <!-- PRUEBA SOCIAL -->
    <div class="trust">
      Usado para crear sistemas automatizados de ingresos digitales
    </div>

  </div>
</section>

<footer>
  © 2026 SistemaMaestroIA
</footer>

</body>
</html>
