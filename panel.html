<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema Maestro IA — Panel</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/panel.css"></head><body><main class="shell"><header><div><h1>Sistema Maestro IA</h1><p>Tu equipo de asistentes IA conoce tu negocio y trabaja con tu contexto.</p></div><button id="logout" class="ghost hidden">Cerrar sesión</button></header><section id="auth" class="card"><h2>Acceso</h2><div class="grid2"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Contraseña (mín. 12 caracteres)"></div><div class="actions"><button id="register">Crear cuenta</button><button id="login" class="secondary">Entrar</button></div><p id="authMsg" class="msg"></p></section><section id="app" class="hidden"><section class="card"><div class="row"><div><h2>Tu negocio</h2><p>Configúralo una vez. Los asistentes usarán este contexto automáticamente.</p></div><div id="plan" class="pill"></div></div><div class="grid2"><input id="negocio" placeholder="Negocio"><input id="oferta" placeholder="Qué vendes"><input id="cliente_ideal" placeholder="Cliente ideal"><input id="tono" placeholder="Tono de comunicación"><textarea id="objetivos" placeholder="Objetivos"></textarea><textarea id="instrucciones" placeholder="Instrucciones adicionales"></textarea></div><div class="actions"><button id="saveProfile">Guardar perfil</button><button id="upgrade" class="accent">Mejorar a Pro — 19,99 €/mes</button><button id="portal" class="secondary hidden">Gestionar suscripción</button></div><p id="profileMsg" class="msg"></p></section><section class="card"><h2>Asistentes</h2><div id="assistants" class="assistants"></div></section><section id="runner" class="card hidden"><h2 id="runnerTitle">Asistente</h2><div id="runnerFields" class="grid2"></div><textarea id="customInstructions" placeholder="Instrucciones personalizadas (Pro)"></textarea><div class="actions"><button id="run">Generar</button><button id="saveAssistant" class="secondary">Guardar personalización</button></div><pre id="output"></pre></section><section class="card"><h2>Historial</h2><div id="history"></div></section></section></main><script src="/panel.js" defer></script></body></html>
